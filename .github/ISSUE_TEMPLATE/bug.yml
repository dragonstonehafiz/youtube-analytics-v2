name: Bug
description: Something is broken or behaving incorrectly
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Add each verifiable condition that confirms the bug is fixed as a Markdown
        checkbox, numbered sequentially (AC-1, AC-2, ...). Keep only essential,
        non-overlapping outcomes and consolidate criteria that describe the same
        result. Use no more than five by default; add more only for distinct
        essential outcomes that cannot reasonably be consolidated.
      placeholder: |
        - [ ] **AC-1:** The reported behavior no longer occurs under the reproduction steps
        - [ ] **AC-2:** The named edge case produces the expected result
        - [ ] **AC-3:** Existing behavior in the affected area is unchanged
    validations:
      required: true

  - type: checkboxes
    id: secrets-confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have removed secrets, tokens, and personal data from this report
          required: true
