name: Enhancement
description: Propose an improvement to existing functionality
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should change, and why?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Add each verifiable completion condition as a Markdown checkbox, numbered
        sequentially (AC-1, AC-2, ...). Keep only essential, non-overlapping
        outcomes and consolidate criteria that describe the same result. Use no
        more than five by default; add more only for distinct essential outcomes
        that cannot reasonably be consolidated.
      placeholder: |
        - [ ] **AC-1:** The improved behavior is observable in the affected area
        - [ ] **AC-2:** The named edge case produces the expected result
        - [ ] **AC-3:** Existing behavior in the affected area is unchanged
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
    validations:
      required: false
