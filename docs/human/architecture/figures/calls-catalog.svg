<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="786" viewBox="0 0 1104 786" role="img" aria-label="Video and playlist catalog: routes/videos.py and routes/playlists.py">
<title>Video and playlist catalog: routes/videos.py and routes/playlists.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Reports, Reader, SQLite. GET /videos in API routes. getVideos in Frontend (api.ts) (Videos · Home · Analytics). GET /playlists/{id}/videos in API routes. getPlaylistVideos in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. GET /videos/published in API routes. getVideosPublished in Frontend (api.ts) (Analytics · PlaylistAnalytics). catalog.playlist_video_ids in Reports (owned members, or None). fetch_joined in Reader. playlists in SQLite. playlist_items in SQLite. videos in SQLite. fetch_scalar in Reader. videos in SQLite. fetch_joined in Reader. videos in SQLite. video_analytics in SQLite. catalog.video_listing in Reports (count + page, or all). GET /playlists in API routes. getPlaylists in Frontend (api.ts) (Playlists). fetch_joined in Reader. playlists in SQLite. playlist_items in SQLite. videos in SQLite. catalog.playlist_listing in Reports (page with its count). GET /videos/{id} in API routes (404 if missing). getVideo in Frontend (api.ts) (VideoAnalytics). fetch_joined in Reader. videos in SQLite. video_analytics in SQLite. catalog.video_detail in Reports. GET /playlists/{id} in API routes (404 if missing). getPlaylist in Frontend (api.ts) (PlaylistAnalytics). fetch_joined in Reader. playlists in SQLite. playlist_items in SQLite. videos in SQLite. catalog.playlist_detail in Reports. getVideos calls GET /videos: page, sort. getPlaylistVideos calls GET /playlists/{id}/videos: id, page. GET /playlists/{id}/videos calls scope_video_ids: playlist_id. getVideosPublished calls GET /videos/published: filters. GET /videos/published calls catalog.playlist_video_ids: playlist_id, if sent. scope_video_ids calls catalog.playlist_video_ids: playlist_id. catalog.playlist_video_ids calls fetch_joined: members. fetch_joined queries playlists: playlist row. fetch_joined queries playlist_items: members. fetch_joined queries videos: owned only. catalog.video_listing calls fetch_scalar: COUNT, paginated only. fetch_scalar queries videos: count. catalog.video_listing calls fetch_joined: rows. fetch_joined queries videos: video rows. fetch_joined queries video_analytics: if watch time. GET /videos calls catalog.video_listing: page, sort. GET /playlists/{id}/videos calls catalog.video_listing: video_ids. GET /videos/published calls catalog.video_listing: five fields. getPlaylists calls GET /playlists: page, sort. catalog.playlist_listing calls fetch_joined: page rows. fetch_joined queries playlists: playlists. fetch_joined queries playlist_items: members. fetch_joined queries videos: owned views. GET /playlists calls catalog.playlist_listing: page, sort. getVideo calls GET /videos/{id}: id. catalog.video_detail calls fetch_joined: one row. fetch_joined queries videos: video row. fetch_joined queries video_analytics: watch time. GET /videos/{id} calls catalog.video_detail: video_id. getPlaylist calls GET /playlists/{id}: id. catalog.playlist_detail calls fetch_joined: one row. fetch_joined queries playlists: playlists. fetch_joined queries playlist_items: members. fetch_joined queries videos: owned views. GET /playlists/{id} calls catalog.playlist_detail: playlist_id.</desc>
