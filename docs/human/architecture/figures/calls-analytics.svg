<svg xmlns="http://www.w3.org/2000/svg" width="1124" height="838" viewBox="0 0 1124 838" role="img" aria-label="Analytics and video statistics: routes/analytics.py and routes/videos.py">
<title>Analytics and video statistics: routes/analytics.py and routes/videos.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Reports, Reader, SQLite. GET /analytics/videos in API routes. getChannelAnalytics in Frontend (api.ts) (Analytics). GET /analytics/playlists/{id} in API routes. getPlaylistAnalytics in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. GET /videos/{id}/analytics in API routes. getVideoAnalytics in Frontend (api.ts) (VideoAnalytics). require_owned_video in API routes. fetch_joined in Reader (fills days). video_analytics in SQLite. videos in SQLite. fx_rates in SQLite. analytics.daily_analytics in Reports. GET /analytics/videos/top in API routes. getTopVideosByViews in Frontend (api.ts) (Analytics · Home). GET /analytics/playlists/{id}/top in API routes. getPlaylistTopVideosByViews in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. fetch_joined in Reader. video_analytics in SQLite. videos in SQLite. fx_rates in SQLite. analytics.top_videos in Reports (top 10). GET /videos/stats in API routes. getVideoStats in Frontend (api.ts) (Analytics · Videos). GET /playlists/{id}/videos/stats in API routes. getPlaylistVideoStats in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. fetch_joined in Reader. video_analytics in SQLite. videos in SQLite. fetch_joined in Reader. videos in SQLite. fetch_joined in Reader. videos in SQLite. fetch_joined in Reader. videos in SQLite. video_analytics in SQLite. fx_rates in SQLite. video_statistics.get_video_stats in Reports (Legacy and New). getChannelAnalytics calls GET /analytics/videos: filters. getPlaylistAnalytics calls GET /analytics/playlists/{id}: id, filters. GET /analytics/playlists/{id} calls scope_video_ids: playlist_id. getVideoAnalytics calls GET /videos/{id}/analytics: id, dates. GET /videos/{id}/analytics calls require_owned_video: video_id. analytics.daily_analytics calls fetch_joined: daily rows. fetch_joined queries video_analytics: metrics. fetch_joined queries videos: filters. fetch_joined queries fx_rates: SGD rate. GET /analytics/videos calls analytics.daily_analytics: filters. GET /analytics/playlists/{id} calls analytics.daily_analytics: video_ids. GET /videos/{id}/analytics calls analytics.daily_analytics: [video_id]. getTopVideosByViews calls GET /analytics/videos/top: sort. getPlaylistTopVideosByViews calls GET /analytics/playlists/{id}/top: id, sort. GET /analytics/playlists/{id}/top calls scope_video_ids: playlist_id. analytics.top_videos calls fetch_joined: ranked. fetch_joined queries video_analytics: totals. fetch_joined queries videos: fields. fetch_joined queries fx_rates: SGD rate. GET /analytics/videos/top calls analytics.top_videos: filters. GET /analytics/playlists/{id}/top calls analytics.top_videos: video_ids. getVideoStats calls GET /videos/stats: filters. getPlaylistVideoStats calls GET /playlists/{id}/videos/stats: id, filters. GET /playlists/{id}/videos/stats calls scope_video_ids: playlist_id. video_statistics.get_video_stats calls fetch_joined: data range. fetch_joined queries video_analytics: first, last. fetch_joined queries videos: filters. video_statistics.get_video_stats calls fetch_joined: publishing. fetch_joined queries videos: first, last. video_statistics.get_video_stats calls fetch_joined: counts. fetch_joined queries videos: counts. video_statistics.get_video_stats calls fetch_joined: period rows. fetch_joined queries videos: groups. fetch_joined queries video_analytics: views. fetch_joined queries fx_rates: SGD rate. GET /videos/stats calls video_statistics.get_video_stats: filters. GET /playlists/{id}/videos/stats calls video_statistics.get_video_stats: video_ids.</desc>
