<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="604" viewBox="0 0 1125 604" role="img" aria-label="Traffic sources: routes/analytics.py and routes/videos.py">
<title>Traffic sources: routes/analytics.py and routes/videos.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Reports, Reader, SQLite. GET /analytics/traffic-sources in API routes. getChannelTrafficSources in Frontend (api.ts) (Analytics · Home). GET /analytics/playlists/{id}/traffic-sources in API routes. getPlaylistTrafficSources in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. GET /videos/{id}/traffic-sources in API routes. getVideoTrafficSources in Frontend (api.ts) (VideoAnalytics). require_owned_video in API routes. fetch in Reader (fills days). video_traffic_sources in SQLite. videos in SQLite. traffic.daily_traffic_sources in Reports. GET /analytics/traffic-sources/top in API routes. getTopVideosByTrafficSource in Frontend (api.ts) (Analytics). GET /analytics/playlists/{id}/traffic-sources/top in API routes. getPlaylistTopVideosByTrafficSource in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. fetch_joined in Reader. video_traffic_sources in SQLite. videos in SQLite. group_by in Reader (in memory). traffic.top_videos_by_traffic_source in Reports. getChannelTrafficSources calls GET /analytics/traffic-sources: filters. getPlaylistTrafficSources calls GET /analytics/playlists/{id}/traffic-sources: id, filters. GET /analytics/playlists/{id}/traffic-sources calls scope_video_ids: playlist_id. getVideoTrafficSources calls GET /videos/{id}/traffic-sources: id, dates. GET /videos/{id}/traffic-sources calls require_owned_video: video_id. traffic.daily_traffic_sources calls fetch: daily rows. fetch queries video_traffic_sources: views. fetch queries videos: filters. GET /analytics/traffic-sources calls traffic.daily_traffic_sources: filters. GET /analytics/playlists/{id}/traffic-sources calls traffic.daily_traffic_sources: video_ids. GET /videos/{id}/traffic-sources calls traffic.daily_traffic_sources: [video_id]. getTopVideosByTrafficSource calls GET /analytics/traffic-sources/top: filters. getPlaylistTopVideosByTrafficSource calls GET /analytics/playlists/{id}/traffic-sources/top: id, filters. GET /analytics/playlists/{id}/traffic-sources/top calls scope_video_ids: playlist_id. traffic.top_videos_by_traffic_source calls fetch_joined: ranked. fetch_joined queries video_traffic_sources: views. fetch_joined queries videos: fields. traffic.top_videos_by_traffic_source calls group_by: per source. GET /analytics/traffic-sources/top calls traffic.top_videos_by_traffic_source: filters. GET /analytics/playlists/{id}/traffic-sources/top calls traffic.top_videos_by_traffic_source: video_ids.</desc>
