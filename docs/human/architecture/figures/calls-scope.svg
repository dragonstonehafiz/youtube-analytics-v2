<svg xmlns="http://www.w3.org/2000/svg" width="825" height="278" viewBox="0 0 825 278" role="img" aria-label="Scope checks: routes/video_scope.py">
<title>Scope checks: routes/video_scope.py</title>
<desc>Lanes from left to right: API routes, Reports, Reader, SQLite. require_owned_video in API routes (404: Video not found). select_one in Reader. videos in SQLite. require_playlist in API routes (404: Playlist not found). select_one in Reader. playlists in SQLite. scope_video_ids in API routes (None, 404 or member IDs). catalog.playlist_video_ids in Reports (owned members). fetch in Reader. playlist_items in SQLite. videos in SQLite. require_owned_video calls select_one: id, own = 1. select_one queries videos: owned video. require_playlist calls select_one: playlist id. select_one queries playlists: playlist. scope_video_ids calls require_playlist: playlist_id. catalog.playlist_video_ids calls fetch: members. fetch queries playlist_items: members. fetch queries videos: owned only. scope_video_ids calls catalog.playlist_video_ids: playlist_id.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; fill: #1c2330; }
  .code, .code-line { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  .code { font-weight: 600; }
  .sub { font-size: 12px; fill: #5b6475; }
  .lane rect { fill: #f0f2f5; stroke: #d9dee6; stroke-width: 1; }
  .lane text { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; fill: #5b6475; }
  .node rect { stroke-width: 1.5; }
  .fe rect { fill: #efe9fa; stroke: #6a4bb3; }
  .route rect { fill: #e6effa; stroke: #2f6fb3; }
  .db rect { fill: #e4f4ec; stroke: #2c8a5a; }
  .sync rect { fill: #f8eedd; stroke: #8a5a14; }
  .yt rect { fill: #fbe6e4; stroke: #b3261e; }
  .edge { fill: none; stroke: #5b6475; stroke-width: 1.6; }
  .edge.dashed { stroke-dasharray: 6 5; }
  .edge-label { font-size: 12px; fill: #5b6475; }
  .arrowhead { fill: #5b6475; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; }
    text { fill: #e6e9ef; }
    .sub, .edge-label, .lane text { fill: #9aa3b2; }
    .lane rect { fill: #222833; stroke: #2f3744; }
