by_search_term calls fetch_joined: videos. fetch_joined queries search_terms: views. fetch_joined queries videos: fields. GET /analytics/search-insights/videos calls traffic.videos_by_search_term: search_term. GET /analytics/playlists/{id}/search-insights/videos calls traffic.videos_by_search_term: video_ids.</desc>
