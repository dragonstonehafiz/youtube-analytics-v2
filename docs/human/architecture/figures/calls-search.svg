s calls traffic.search_terms: video_ids. GET /analytics/playlists/{id}/search-insights/top calls traffic.search_terms: video_ids. GET /analytics/videos/{id}/search-insights calls traffic.search_terms: [video_id]. getVideosBySearchTerm calls GET /analytics/search-insights/videos: term. getPlaylistVideosBySearchTerm calls GET /analytics/playlists/{id}/search-insights/videos: id, term. GET /analytics/playlists/{id}/search-insights/videos calls resolve_playlist_video_ids: playlist_id. traffic.videos_by_search_term calls fetch_joined: videos. fetch_joined queries search_terms: views. fetch_joined queries videos: fields. GET /analytics/search-insights/videos calls traffic.videos_by_search_term: search_term. GET /analytics/playlists/{id}/search-insights/videos calls traffic.videos_by_search_term: video_ids.</desc>
