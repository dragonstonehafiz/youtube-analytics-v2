<svg xmlns="http://www.w3.org/2000/svg" width="1001" height="446" viewBox="0 0 1001 446" role="img" aria-label="Comments and date range: routes/comments.py and routes/metadata.py">
<title>Comments and date range: routes/comments.py and routes/metadata.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Reports, Reader, SQLite. GET /comments in API routes. getComments in Frontend (api.ts) (CommentsTab). GET /comments/playlists/{id} in API routes. getPlaylistComments in Frontend (api.ts) (CommentsTab). require_playlist in API routes. GET /comments/videos/{id} in API routes. getVideoComments in Frontend (api.ts) (CommentsTab). require_owned_video in API routes. fetch_scalar in Reader. comments in SQLite. comment_authors in SQLite. videos in SQLite. playlist_items in SQLite. fetch_joined in Reader. comments in SQLite. comment_authors in SQLite. videos in SQLite. playlist_items in SQLite. comments.comment_feed in Reports (count + page). GET /meta/date-range in API routes. getDateRange in Frontend (api.ts) (PeriodSelect · Sync). scalar in Reader. videos in SQLite. getComments calls GET /comments: filters. getPlaylistComments calls GET /comments/playlists/{id}: id, filters. GET /comments/playlists/{id} calls require_playlist: playlist_id. getVideoComments calls GET /comments/videos/{id}: id, filters. GET /comments/videos/{id} calls require_owned_video: video_id. comments.comment_feed calls fetch_scalar: COUNT. fetch_scalar queries comments: comments. fetch_scalar queries comment_authors: authors. fetch_scalar queries videos: fields. fetch_scalar queries playlist_items: if playlist. comments.comment_feed calls fetch_joined: page rows. fetch_joined queries comments: comments. fetch_joined queries comment_authors: authors. fetch_joined queries videos: fields. fetch_joined queries playlist_items: if playlist. GET /comments calls comments.comment_feed: filters. GET /comments/playlists/{id} calls comments.comment_feed: playlist_id. GET /comments/videos/{id} calls comments.comment_feed: video_id. getDateRange calls GET /meta/date-range: on mount. GET /meta/date-range calls scalar: MIN published_at. scalar queries videos: earliest.</desc>
<style>
