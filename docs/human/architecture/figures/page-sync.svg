    .local rect { fill: #222833; stroke: #6b7486; } .local text { fill: #e6e9ef; }
  }
  .legend-text { font-size: 12px; fill: #5b6475; }
  @media (prefers-color-scheme: dark) { .legend-text { fill: #9aa3b2; } }
</style>
