<svg xmlns="http://www.w3.org/2000/svg" width="984" height="444" viewBox="0 0 984 444" role="img" aria-label="Sync history and database storage: routes/synchronization.py">
<title>Sync history and database storage: routes/synchronization.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Reports, Reader, SQLite. getSyncRuns Sync. GET /sync/runs. sync_history. sync_batches. fetch_scalar. sync_runs. fetch. sync_runs. select. sync_runs. group_by in memory. getDatabaseStats Sync. GET /sync/database. storage. database_storage read-only apsw. PRAGMA page_size. PRAGMA page_count. sqlite_schema. dbstat. every app table. Arrow: page. Arrow: page, size. Arrow: batch count. Arrow: batch IDs. Arrow: batches. Arrow: page. Arrow: stage runs. Arrow: runs. Arrow: by batch_id. Arrow: page size. Arrow: total pages. Arrow: index owners. Arrow: bytes per table and index. Arrow: row counts. Arrow: storage. Arrow: measure. storage.database_storage reads SQLite directly through a read-only apsw connection, not through the reader.</desc>
