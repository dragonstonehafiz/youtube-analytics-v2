<svg xmlns="http://www.w3.org/2000/svg" width="874" height="251" viewBox="0 0 874 251" role="img" aria-label="Sync history: routes/synchronization.py">
<title>Sync history: routes/synchronization.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Reports, Reader, SQLite. GET /sync/runs in API routes. getSyncRuns in Frontend (api.ts) (Sync). fetch_scalar in Reader. sync_runs in SQLite. fetch in Reader. sync_runs in SQLite. select in Reader. sync_runs in SQLite. group_by in Reader (in memory). sync_history.sync_batches in Reports. getSyncRuns calls GET /sync/runs: page. sync_history.sync_batches calls fetch_scalar: batch count. fetch_scalar queries sync_runs: batch IDs. sync_history.sync_batches calls fetch: batches. fetch queries sync_runs: page. sync_history.sync_batches calls select: stage runs. select queries sync_runs: runs. sync_history.sync_batches calls group_by: by batch_id. GET /sync/runs calls sync_history.sync_batches: page, size.</desc>
