  .code { font-weight: 600; }
  .sub { font-size: 12px; fill: #5b6475; }
  .lane rect { fill: #f0f2f5; stroke: #d9dee6; stroke-width: 1; }
  .lane text { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; fill: #5b6475; }
  .node rect { stroke-width: 1.5; }
  .fe rect { fill: #efe9fa; stroke: #6a4bb3; }
  .route rect { fill: #e6effa; stroke: #2f6fb3; }
  .db rect { fill: #e4f4ec; stroke: #2c8a5a; }
  .sync rect { fill: #f8eedd; stroke: #8a5a14; }
  .yt rect { fill: #fbe6e4; stroke: #b3261e; }
  .edge { fill: none; stroke: #5b6475; stroke-width: 1.6; }
  .edge.dashed { stroke-dasharray: 6 5; }
  .edge-label { font-size: 12px; fill: #5b6475; }
  .arrowhead { fill: #5b6475; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; }
