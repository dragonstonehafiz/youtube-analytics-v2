<svg xmlns="http://www.w3.org/2000/svg" width="343" height="62" viewBox="0 0 343 62" role="img" aria-label="Components on the Playlists page">
<title>Components on the Playlists page</title>

<style>
  .bg { fill: #ffffff; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; dominant-baseline: central; }
  .edge { fill: none; stroke: #9aa3b2; stroke-width: 1.5; }
  .page rect { fill: #fbe9e8; stroke: #c4302b; stroke-width: 1.5; }
  .page text { fill: #c4302b; font-weight: 700; }
  .tab rect { fill: #e6effa; stroke: #2f6fb3; stroke-width: 1.2; }
  .tab text { fill: #1f4f85; font-weight: 600; }
  .sub rect { fill: #f3f7fc; stroke: #7da3cf; stroke-width: 1; stroke-dasharray: 4 3; }
  .sub text { fill: #1f4f85; }
  .comp rect { fill: #efe9fa; stroke: #6a4bb3; stroke-width: 1.2; }
  .comp text { fill: #3f2a80; }
  .local rect { fill: #f0f2f5; stroke: #8a93a3; stroke-width: 1; stroke-dasharray: 4 3; }
  .local text { fill: #1c2330; font-style: italic; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; }
    .edge { stroke: #5b6475; }
    .page rect { fill: #3a1e1d; stroke: #ff6b63; } .page text { fill: #ff8a80; }
    .tab rect { fill: #1b2a3d; stroke: #7db3ef; } .tab text { fill: #a9cdf5; }
    .sub rect { fill: #17212e; stroke: #4f79a8; } .sub text { fill: #a9cdf5; }
    .comp rect { fill: #2a2340; stroke: #b9a2f5; } .comp text { fill: #d6c9fb; }
    .local rect { fill: #222833; stroke: #6b7486; } .local text { fill: #e6e9ef; }
  }
</style>
<rect class="bg" width="343" height="62" rx="10"/>
<path class="edge" d="M193.3,31.0 H215.3 V31.0 H237.3"/>
<g class="comp"><rect x="237.3" y="16.0" width="89.7" height="30" rx="6"/><text x="249.3" y="31.0">AsyncCard</text></g>
