<title>Related videos: routes/analytics.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Reports, Reader, SQLite. GET /analytics/related-videos/referrers in API routes. getRelatedVideoReferrers in Frontend (api.ts) (Analytics). GET /analytics/playlists/{id}/related-videos/referrers in API routes. getPlaylistRelatedVideoReferrers in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. GET /analytics/videos/{id}/related-videos/referrers in API routes. getVideoRelatedVideoReferrers in Frontend (api.ts) (VideoAnalytics). require_owned_video in API routes. fetch_scalar in Reader. related_videos in SQLite. videos in SQLite. fetch_joined in Reader. related_videos in SQLite. videos in SQLite. traffic.related_video_referrers in Reports (total + list). GET /analytics/related-videos/destinations in API routes. getRelatedVideoDestinations in Frontend (api.ts) (Analytics · VideoAnalytics). GET /analytics/playlists/{id}/related-videos/destinations in API routes. getPlaylistRelatedVideoDestinations in Frontend (api.ts) (PlaylistAnalytics). scope_video_ids in API routes. fetch_joined in Reader. related_videos in SQLite. videos in SQLite. traffic.related_video_destinations in Reports. getRelatedVideoReferrers calls GET /analytics/related-videos/referrers: own. getPlaylistRelatedVideoReferrers calls GET /analytics/playlists/{id}/related-videos/referrers: id, own. GET /analytics/playlists/{id}/related-videos/referrers calls scope_video_ids: playlist_id. getVideoRelatedVideoReferrers calls GET /analytics/videos/{id}/related-videos/referrers: id, own. GET /analytics/videos/{id}/related-videos/referrers calls require_owned_video: video_id. traffic.related_video_referrers calls fetch_scalar: total views. fetch_scalar queries related_videos: views. fetch_scalar queries videos: owned targets. traffic.related_video_referrers calls fetch_joined: referrers. fetch_joined queries related_videos: referrers. fetch_joined queries videos: titles. GET /analytics/related-videos/referrers calls traffic.related_video_referrers: own. GET /analytics/playlists/{id}/related-videos/referrers calls traffic.related_video_referrers: video_ids. GET /analytics/videos/{id}/related-videos/referrers calls traffic.related_video_referrers: [video_id]. getRelatedVideoDestinations calls GET /analytics/related-videos/destinations: referrer. getPlaylistRelatedVideoDestinations calls GET /analytics/playlists/{id}/related-videos/destinations: referrer. GET /analytics/playlists/{id}/related-videos/destinations calls scope_video_ids: playlist_id. traffic.related_video_destinations calls fetch_joined: destinations. fetch_joined queries related_videos: views. fetch_joined queries videos: owned targets. GET /analytics/related-videos/destinations calls traffic.related_video_destinations: referrer. GET /analytics/playlists/{id}/related-videos/destinations calls traffic.related_video_destinations: video_ids.</desc>
