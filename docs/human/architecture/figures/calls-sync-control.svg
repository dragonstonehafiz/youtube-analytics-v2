<svg xmlns="http://www.w3.org/2000/svg" width="909" height="396" viewBox="0 0 909 396" role="img" aria-label="Sync control: routes/synchronization.py">
<title>Sync control: routes/synchronization.py</title>
<desc>Lanes from left to right: Frontend (api.ts), API routes, Sync, Reader, SQLite. GET /sync/status in API routes. getSyncStatus in Frontend (api.ts) (Sync · SyncStatus). POST /sync/stop in API routes (409 if idle). stopSync in Frontend (api.ts) (Sync). sync.validate_plan in Sync (400 if invalid). sync.try_begin_sync in Sync (409 if active). sync.execute_plan in Sync (runs the stages). POST /sync/trigger in API routes (returns queued). triggerSync in Frontend (api.ts) (Sync). sync.get_sync_status in Sync (in-memory snapshot). sync.request_stop in Sync (sets the stop flag). scalar in Reader. videos in SQLite. getSyncStatus calls GET /sync/status: every 5 s. stopSync calls POST /sync/stop: stop. triggerSync calls POST /sync/trigger: plan. GET /sync/status calls sync.get_sync_status: read state. POST /sync/stop calls sync.request_stop: stop. POST /sync/trigger calls sync.validate_plan: stages. POST /sync/trigger calls sync.try_begin_sync: reserve. POST /sync/trigger queues sync.execute_plan: add_task. sync.validate_plan calls scalar: year check. scalar queries videos: earliest.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; fill: #1c2330; }
  .code, .code-line { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
  .code { font-weight: 600; }
  .sub { font-size: 12px; fill: #5b6475; }
  .lane rect { fill: #f0f2f5; stroke: #d9dee6; stroke-width: 1; }
  .lane text { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; fill: #5b6475; }
  .node rect { stroke-width: 1.5; }
  .fe rect { fill: #efe9fa; stroke: #6a4bb3; }
  .route rect { fill: #e6effa; stroke: #2f6fb3; }
  .db rect { fill: #e4f4ec; stroke: #2c8a5a; }
  .sync rect { fill: #f8eedd; stroke: #8a5a14; }
  .yt rect { fill: #fbe6e4; stroke: #b3261e; }
  .edge { fill: none; stroke: #5b6475; stroke-width: 1.6; }
  .edge.dashed { stroke-dasharray: 6 5; }
  .edge-label { font-size: 12px; fill: #5b6475; }
  .arrowhead { fill: #5b6475; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; }
    text { fill: #e6e9ef; }
    .sub, .edge-label, .lane text { fill: #9aa3b2; }
    .lane rect { fill: #222833; stroke: #2f3744; }
    .fe rect { fill: #2a2340; stroke: #b9a2f5; }
    .route rect { fill: #1b2a3d; stroke: #7db3ef; }
    .db rect { fill: #183126; stroke: #6fd3a0; }
    .sync rect { fill: #342816; stroke: #e7b56a; }
    .yt rect { fill: #3a1d1b; stroke: #ff8a80; }
    .edge { stroke: #9aa3b2; }
    .arrowhead { fill: #9aa3b2; }
  }
</style>
