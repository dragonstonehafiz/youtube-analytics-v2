<svg xmlns="http://www.w3.org/2000/svg" width="603" height="134" viewBox="0 0 603 134" role="img" aria-label="Routes used by the Sync History tab">
<title>Routes used by the Sync History tab</title>

<style>
  .bg { fill: #ffffff; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; dominant-baseline: central; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .edge { fill: none; stroke: #9aa3b2; stroke-width: 1.5; }
  .edge-label { font-size: 11.5px; font-style: italic; fill: #5b6475; }
  .root rect { fill: #fbe9e8; stroke: #c4302b; stroke-width: 1.5; } .root text { fill: #c4302b; font-weight: 700; }
  .card rect { fill: #e6effa; stroke: #2f6fb3; stroke-width: 1.2; } .card text { fill: #1f4f85; font-weight: 600; }
  .sub rect { fill: #f3f7fc; stroke: #7da3cf; stroke-width: 1; stroke-dasharray: 4 3; } .sub text { fill: #1f4f85; }
  .ep rect { fill: #efe9fa; stroke: #6a4bb3; stroke-width: 1.2; } .ep text { fill: #3f2a80; }
  .ep-tab rect { fill: #fff4d6; stroke: #b08b3a; stroke-width: 1.2; stroke-dasharray: 5 3; } .ep-tab text { fill: #6b4f00; }
  .ep-after rect { fill: #ffffff; stroke: #6a4bb3; stroke-width: 1.2; stroke-dasharray: 5 3; } .ep-after text { fill: #3f2a80; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; } .edge { stroke: #5b6475; } .edge-label { fill: #9aa3b2; }
    .root rect { fill: #3a1e1d; stroke: #ff6b63; } .root text { fill: #ff8a80; }
    .card rect { fill: #1b2a3d; stroke: #7db3ef; } .card text { fill: #a9cdf5; }
    .sub rect { fill: #17212e; stroke: #4f79a8; } .sub text { fill: #a9cdf5; }
    .ep rect { fill: #2a2340; stroke: #b9a2f5; } .ep text { fill: #d6c9fb; }
    .ep-tab rect { fill: #362d12; stroke: #c9a24a; } .ep-tab text { fill: #f2d98a; }
    .ep-after rect { fill: #1a1f27; stroke: #b9a2f5; } .ep-after text { fill: #d6c9fb; }
  }
  .legend-text { font-size: 12px; fill: #5b6475; }
  .legend-rule { stroke: #d9dee6; stroke-width: 1; }
  @media (prefers-color-scheme: dark) { .legend-text { fill: #9aa3b2; } .legend-rule { stroke: #2f3744; } }
</style>
<rect class="bg" width="603" height="134" rx="10"/>
<path class="edge" d="M276.8,31.0 H294.8 V31.0 H316.8"/>
<path class="edge" d="M119.2,31.0 H137.2 V31.0 H159.2"/>
<g class="ep-tab"><rect x="316.8" y="16.0" width="270.5" height="30" rx="6"/><text class="mono" x="328.8" y="31.0">/sync/runs  (one page of 25 syncs)</text></g>
<g class="card"><rect x="159.2" y="16.0" width="117.6" height="30" rx="6"/><text x="171.2" y="31.0">History table</text></g>
<g class="root"><rect x="16.0" y="16.0" width="103.2" height="30" rx="6"/><text x="28.0" y="31.0">History tab</text></g>
<line class="legend-rule" x1="16" y1="68.0" x2="587.0" y2="68.0"/>
<g class="root"><rect x="16.0" y="82.0" width="22" height="14" rx="3"/></g>
<text class="legend-text" x="44.0" y="89.0">Where it starts</text>
<g class="card"><rect x="164.5" y="82.0" width="22" height="14" rx="3"/></g>
<text class="legend-text" x="192.5" y="89.0">Card on the page</text>
<g class="ep-tab"><rect x="16.0" y="106.0" width="22" height="14" rx="3"/></g>
<text class="legend-text" x="44.0" y="113.0">Request sent only when this tab is shown</text>
</svg>
