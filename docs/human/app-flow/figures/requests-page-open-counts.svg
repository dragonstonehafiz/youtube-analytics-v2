<svg xmlns="http://www.w3.org/2000/svg" width="820" height="298" viewBox="0 0 820 298" role="img" aria-label="Requests sent when each page opens">
<title>Requests sent when each page opens</title>
<style>
  .bg { fill: #ffffff; } text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: #1c2330; dominant-baseline: central; }
  .first { fill: #b9a2f5; stroke: #6a4bb3; } .then { fill: #ffffff; stroke: #6a4bb3; stroke-dasharray: 4 3; }
  .muted { fill: #5b6475; font-size: 12px; }
  @media (prefers-color-scheme: dark) { .bg { fill: #1a1f27; } text { fill: #e6e9ef; } .first { fill: #4b3b80; stroke: #b9a2f5; } .then { fill: #1a1f27; stroke: #b9a2f5; } .muted { fill: #9aa3b2; } }
</style>
<rect class="bg" width="820" height="298" rx="10"/>
<text x="20" y="32">Home</text>
<rect class="first" x="160" y="20" width="150" height="24" rx="4"/>
<rect class="then" x="310" y="20" width="30" height="24" rx="4"/>
<text x="350" y="32">5 + 1 after</text>
<text x="20" y="66">Videos</text>
<rect class="first" x="160" y="54" width="90" height="24" rx="4"/>
<text x="260" y="66">3</text>
<text x="20" y="100">Playlists</text>
<rect class="first" x="160" y="88" width="30" height="24" rx="4"/>
<text x="200" y="100">1</text>
<text x="20" y="134">Analytics, channel</text>
<rect class="first" x="160" y="122" width="420" height="24" rx="4"/>
<rect class="then" x="580" y="122" width="60" height="24" rx="4"/>
<text x="650" y="134">14 + 2 after</text>
<text x="20" y="168">Analytics, video</text>
<rect class="first" x="160" y="156" width="150" height="24" rx="4"/>
<text x="320" y="168">5</text>
<text x="20" y="202">Analytics, playlist</text>
<rect class="first" x="160" y="190" width="480" height="24" rx="4"/>
<rect class="then" x="640" y="190" width="60" height="24" rx="4"/>
<text x="710" y="202">16 + 2 after</text>
<text x="20" y="236">Sync</text>
<rect class="first" x="160" y="224" width="60" height="24" rx="4"/>
<text x="230" y="236">2</text>
<rect class="first" x="20" y="268" width="14" height="14" rx="3"/><text class="muted" x="40" y="275">Request sent when the page opens</text>
<rect class="then" x="250" y="268" width="14" height="14" rx="3"/><text class="muted" x="270" y="275">From previous request</text>
</svg>
