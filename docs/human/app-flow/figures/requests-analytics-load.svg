  .ep rect { fill: #efe9fa; stroke: #6a4bb3; stroke-width: 1.2; } .ep text { fill: #3f2a80; }
  .ep-tab rect { fill: #fff4d6; stroke: #b08b3a; stroke-width: 1.2; stroke-dasharray: 5 3; } .ep-tab text { fill: #6b4f00; }
  .ep-after rect { fill: #ffffff; stroke: #6a4bb3; stroke-width: 1.2; stroke-dasharray: 5 3; } .ep-after text { fill: #3f2a80; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1f27; } .edge { stroke: #5b6475; } .edge-label { fill: #9aa3b2; }
    .root rect { fill: #3a1e1d; stroke: #ff6b63; } .root text { fill: #ff8a80; }
    .card rect { fill: #1b2a3d; stroke: #7db3ef; } .card text { fill: #a9cdf5; }
    .sub rect { fill: #17212e; stroke: #4f79a8; } .sub text { fill: #a9cdf5; }
    .ep rect { fill: #2a2340; stroke: #b9a2f5; } .ep text { fill: #d6c9fb; }
    .ep-tab rect { fill: #362d12; stroke: #c9a24a; } .ep-tab text { fill: #f2d98a; }
    .ep-after rect { fill: #1a1f27; stroke: #b9a2f5; } .ep-after text { fill: #d6c9fb; }
  }
</style>
